name: VICOM Billing Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vicom_billing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vicom_billing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django checks
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "True"
          POSTGRES_DB: vicom_billing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
        run: python manage.py check

      - name: Run migrations
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "True"
          POSTGRES_DB: vicom_billing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
        run: python manage.py migrate --noinput

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "True"
          POSTGRES_DB: vicom_billing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
        run: python manage.py test
